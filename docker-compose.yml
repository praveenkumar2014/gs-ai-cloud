name: ${COMPOSE_PROJECT_NAME:-gs-ai-cloud}
include:
  - stacks/core.yml
  - stacks/database.yml
  - stacks/ai.yml
  - stacks/apps.yml
  - stacks/agents.yml
  - stacks/monitoring.yml

networks:
  edge:
    name: gs-ai-cloud-edge
    driver: bridge
  internal:
    name: gs-ai-cloud-internal
    driver: bridge
    internal: true
  data:
    name: gs-ai-cloud-data
    driver: bridge
    internal: true
  monitoring:
    name: gs-ai-cloud-monitoring
    driver: bridge

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"
