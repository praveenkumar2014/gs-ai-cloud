services:
  ollama:
    image: ollama/ollama:${OLLAMA_VERSION:-latest}
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-24h}
      CUDA_VISIBLE_DEVICES: ${CUDA_VISIBLE_DEVICES:-all}
    volumes: [ollama_data:/root/.ollama]
    networks: [internal]
    profiles: [cpu, gpu]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: ${GPU_COUNT:-all}
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    logging: &default-logging
      driver: json-file
      options: {max-size: "10m", max-file: "5"}

  litellm:
    image: ghcr.io/berriai/litellm:${LITELLM_VERSION:-main-latest}
    restart: unless-stopped
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes: [../configs/litellm/config.yaml:/app/config.yaml:ro]
    networks: [internal, data]
    depends_on: [postgres, redis]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:4000/health/readiness', timeout=5)\""]
      interval: 30s
      timeout: 10s
      retries: 5
    logging: *default-logging

  vllm:
    image: vllm/vllm-openai:${VLLM_VERSION:-latest}
    restart: unless-stopped
    command: ["--model", "${VLLM_MODEL}", "--host", "0.0.0.0", "--port", "8000"]
    environment: {HF_HOME: /models, CUDA_VISIBLE_DEVICES: "${CUDA_VISIBLE_DEVICES:-all}"}
    volumes: [vllm_models:/models]
    networks: [internal]
    profiles: [gpu]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: ${GPU_COUNT:-all}
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
    logging: *default-logging

  sglang:
    image: lmsysorg/sglang:${SGLANG_VERSION:-latest}
    restart: unless-stopped
    command: ["python3", "-m", "sglang.launch_server", "--model-path", "${SGLANG_MODEL}", "--host", "0.0.0.0", "--port", "30000"]
    environment: {HF_HOME: /models, CUDA_VISIBLE_DEVICES: "${CUDA_VISIBLE_DEVICES:-all}"}
    volumes: [sglang_models:/models]
    networks: [internal]
    profiles: [gpu]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: ${GPU_COUNT:-all}
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:30000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
    logging: *default-logging

  infinity:
    image: michaelf34/infinity:${INFINITY_VERSION:-latest}
    restart: unless-stopped
    command: ["v2", "--model-id", "${INFINITY_MODEL_ID}", "--port", "7997"]
    environment: {HF_HOME: /models}
    volumes: [infinity_models:/models]
    networks: [internal]
    profiles: [cpu, gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:7997/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    logging: *default-logging

volumes:
  ollama_data:
  vllm_models:
  sglang_models:
  infinity_models:
