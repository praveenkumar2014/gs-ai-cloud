version: '3.8'

networks:
  gs-ai-network:
    external: true
    name: ${DOCKER_NETWORK:-gs-ai-network}

volumes:
  postgres_data:
    name: gs_ai_postgres_data
  redis_data:
    name: gs_ai_redis_data
  minio_data:
    name: gs_ai_minio_data
  qdrant_data:
    name: gs_ai_qdrant_data

services:
  postgres:
    image: postgres:16-alpine
    container_name: gs-ai-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gscloud}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_password_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-gscloud}
      PGTZ: ${TZ:-UTC}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - gs-ai-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gscloud} -d ${POSTGRES_DB:-gscloud}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  redis:
    image: redis:7-alpine
    container_name: gs-ai-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-redis_secure_password_change_me}
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - gs-ai-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secure_password_change_me}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "15m"
        max-file: "3"

  minio:
    image: minio/minio:RELEASE.2024-03-15T20-13-24Z
    container_name: gs-ai-minio
    restart: unless-stopped
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_secure_password_change_me}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - gs-ai-network
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  qdrant:
    image: qdrant/qdrant:v1.8.4
    container_name: gs-ai-qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-qdrant_secure_api_key_change_me}
      QDRANT__SERVICE__ENABLE_CORS: "true"
    volumes:
      - qdrant_data:/qdrant/storage
      - ./configs/qdrant/config.yaml:/qdrant/config/production.yaml:ro
    networks:
      - gs-ai-network
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 6333 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
