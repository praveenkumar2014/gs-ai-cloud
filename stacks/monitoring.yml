services:
  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--storage.tsdb.retention.time=30d"]
    volumes: [../configs/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro, prometheus_data:/prometheus]
    networks: [edge, monitoring, internal]
    labels:
      traefik.enable: "true"
      traefik.http.routers.prometheus.rule: Host(`${PROMETHEUS_HOST}`)
      traefik.http.routers.prometheus.entrypoints: websecure
      traefik.http.routers.prometheus.tls.certresolver: letsencrypt
      traefik.http.services.prometheus.loadbalancer.server.port: "9090"
    healthcheck: {test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy || exit 1"], interval: 30s, timeout: 10s, retries: 5}
    logging: &default-logging {driver: json-file, options: {max-size: "10m", max-file: "5"}}
  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    environment: {GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER}", GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD}"}
    volumes: [grafana_data:/var/lib/grafana, ../configs/grafana/provisioning:/etc/grafana/provisioning:ro]
    networks: [edge, monitoring]
    labels:
      traefik.enable: "true"
      traefik.http.routers.grafana.rule: Host(`${GRAFANA_HOST}`)
      traefik.http.routers.grafana.entrypoints: websecure
      traefik.http.routers.grafana.tls.certresolver: letsencrypt
      traefik.http.services.grafana.loadbalancer.server.port: "3000"
    healthcheck: {test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"], interval: 30s, timeout: 10s, retries: 5}
    logging: *default-logging
  loki:
    image: grafana/loki:latest
    restart: unless-stopped
    command: ["-config.file=/etc/loki/config.yml"]
    volumes: [../configs/loki/config.yml:/etc/loki/config.yml:ro, loki_data:/loki]
    networks: [monitoring]
    healthcheck: {test: ["CMD-SHELL", "wget -qO- http://localhost:3100/ready || exit 1"], interval: 30s, timeout: 10s, retries: 5}
    logging: *default-logging
  promtail:
    image: grafana/promtail:latest
    restart: unless-stopped
    command: ["-config.file=/etc/promtail/config.yml"]
    volumes: [../configs/promtail/config.yml:/etc/promtail/config.yml:ro, /var/log:/var/log:ro, /var/lib/docker/containers:/var/lib/docker/containers:ro]
    networks: [monitoring]
    healthcheck: {test: ["CMD-SHELL", "wget -qO- http://localhost:9080/ready || exit 1"], interval: 30s, timeout: 10s, retries: 5}
    logging: *default-logging
  uptime-kuma:
    image: louislam/uptime-kuma:latest
    restart: unless-stopped
    volumes: [uptime_kuma_data:/app/data]
    networks: [edge, monitoring]
    labels:
      traefik.enable: "true"
      traefik.http.routers.kuma.rule: Host(`${KUMA_HOST}`)
      traefik.http.routers.kuma.entrypoints: websecure
      traefik.http.routers.kuma.tls.certresolver: letsencrypt
      traefik.http.services.kuma.loadbalancer.server.port: "3001"
    healthcheck: {test: ["CMD-SHELL", "node extra/healthcheck.js"], interval: 30s, timeout: 10s, retries: 5}
    logging: *default-logging
volumes:
  prometheus_data: {}
  grafana_data: {}
  loki_data: {}
  uptime_kuma_data: {}
