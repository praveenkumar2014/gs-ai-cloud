http:
  middlewares:
    security-headers:
      headers:
        frameDeny: true
        sslRedirect: true
        browserXssFilter: true
        contentTypeNosniff: true
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        stsPreload: true
    gzip-compress:
      compress: {}

tls:
  options:
    default:
      minVersion: VersionTLS12
      sniStrict: false
