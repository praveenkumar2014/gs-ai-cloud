version: '3.8'

networks:
  gs-ai-network:
    external: true
    name: ${DOCKER_NETWORK:-gs-ai-network}

volumes:
  ollama_data:
    name: gs_ai_ollama_data
  vllm_data:
    name: gs_ai_vllm_data
  sglang_data:
    name: gs_ai_sglang_data
  infinity_data:
    name: gs_ai_infinity_data

services:
  ollama:
    image: ollama/ollama:latest
    container_name: gs-ai-ollama
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    environment:
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-24h}
      OLLAMA_HOST: "0.0.0.0"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - gs-ai-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "30m"
        max-file: "5"

  litellm:
    image: ghcr.io/berriai/litellm:main-v1.35.30
    container_name: gs-ai-litellm
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${LITELLM_PORT:-4000}:4000"
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-gs-ai-cloud-master-key-change-me}
      POSTGRES_USER: ${POSTGRES_USER:-gscloud}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_password_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-gscloud}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_secure_password_change_me}
    command: ["--config", "/app/config.yaml", "--port", "4000", "--num_workers", "4"]
    volumes:
      - ./configs/litellm/config.yaml:/app/config.yaml:ro
    networks:
      - gs-ai-network
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 4000 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  vllm:
    image: vllm/vllm-openai:latest
    container_name: gs-ai-vllm
    restart: unless-stopped
    ports:
      - "${VLLM_PORT:-8000}:8000"
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HUGGING_FACE_HUB_TOKEN:-}
      MODEL_NAME: ${VLLM_MODEL:-facebook/opt-125m}
    command: --model ${VLLM_MODEL:-facebook/opt-125m} --port 8000 --host 0.0.0.0
    volumes:
      - vllm_data:/root/.cache/huggingface
    networks:
      - gs-ai-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8000 || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "30m"
        max-file: "5"

  sglang:
    image: lmsysorg/sglang:latest
    container_name: gs-ai-sglang
    restart: unless-stopped
    ports:
      - "${SGLANG_PORT:-30000}:30000"
    environment:
      MODEL_NAME: ${SGLANG_MODEL:-meta-llama/Llama-2-7b-chat-hf}
    command: python3 -m sglang.launch_server --model-path ${SGLANG_MODEL:-meta-llama/Llama-2-7b-chat-hf} --host 0.0.0.0 --port 30000
    volumes:
      - sglang_data:/root/.cache/huggingface
    networks:
      - gs-ai-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 30000 || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "30m"
        max-file: "5"

  infinity:
    image: michaelfeil/infinity:latest
    container_name: gs-ai-infinity
    restart: unless-stopped
    ports:
      - "${INFINITY_PORT:-7997}:7997"
    environment:
      INFINITY_MODEL_ID: ${INFINITY_MODEL:-BAAI/bge-small-en-v1.5}
      INFINITY_PORT: 7997
    command: v2 --model-id ${INFINITY_MODEL:-BAAI/bge-small-en-v1.5} --port 7997
    volumes:
      - infinity_data:/root/.cache/huggingface
    networks:
      - gs-ai-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 7997 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
