version: '3.8'

networks:
  gs-ai-network:
    external: true
    name: ${DOCKER_NETWORK:-gs-ai-network}

volumes:
  ollama_data:
    name: gs_ai_ollama_data
  vllm_data:
    name: gs_ai_vllm_data
  sglang_data:
    name: gs_ai_sglang_data
  infinity_data:
    name: gs_ai_infinity_data

services:
  ollama:
    image: ollama/ollama:latest
    container_name: gs-ai-ollama
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    environment:
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-24h}
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - gs-ai-network
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  litellm:
    image: litellm/litellm:latest
    container_name: gs-ai-litellm
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${LITELLM_PORT:-4000}:4000"
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-gs-ai-cloud-master-key-change-me}
    volumes:
      - ./configs/litellm/config.yaml:/app/config.yaml:ro
    networks:
      - gs-ai-network
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 4000 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  vllm:
    image: vllm/vllm-openai:latest
    container_name: gs-ai-vllm
    restart: unless-stopped
    ports:
      - "${VLLM_PORT:-8000}:8000"
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HUGGING_FACE_HUB_TOKEN:-}
    command: --model ${VLLM_MODEL:-facebook/opt-125m} --port 8000 --host 0.0.0.0
    volumes:
      - vllm_data:/root/.cache/huggingface
    networks:
      - gs-ai-network
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8000 || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5

  sglang:
    image: lmsysorg/sglang:latest
    container_name: gs-ai-sglang
    restart: unless-stopped
    ports:
      - "${SGLANG_PORT:-30000}:30000"
    command: python3 -m sglang.launch_server --model-path ${SGLANG_MODEL:-meta-llama/Llama-2-7b-chat-hf} --host 0.0.0.0 --port 30000
    volumes:
      - sglang_data:/root/.cache/huggingface
    networks:
      - gs-ai-network
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 30000 || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5

  infinity:
    image: python:3.11-slim
    container_name: gs-ai-infinity
    restart: unless-stopped
    command: python3 -m http.server 7997
    ports:
      - "${INFINITY_PORT:-7997}:7997"
    volumes:
      - infinity_data:/root/.cache/huggingface
    networks:
      - gs-ai-network
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 7997 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
