version: '3.8'

networks:
  gs-ai-network:
    external: true
    name: ${DOCKER_NETWORK:-gs-ai-network}

volumes:
  prometheus_data:
    name: gs_ai_prometheus_data
  grafana_data:
    name: gs_ai_grafana_data
  loki_data:
    name: gs_ai_loki_data
  uptime_kuma_data:
    name: gs_ai_uptime_kuma_data

services:
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: gs-ai-prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    volumes:
      - ./configs/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - gs-ai-network
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "9090"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  grafana:
    image: grafana/grafana:10.4.0
    container_name: gs-ai-grafana
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_healthy
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-grafana_admin_password_change_me}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./configs/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - gs-ai-network
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 3000 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  loki:
    image: grafana/loki:2.9.4
    container_name: gs-ai-loki
    restart: unless-stopped
    ports:
      - "${LOKI_PORT:-3100}:3100"
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./configs/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/tmp/loki
    networks:
      - gs-ai-network
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 3100 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  promtail:
    image: grafana/promtail:2.9.4
    container_name: gs-ai-promtail
    restart: unless-stopped
    depends_on:
      docker-socket-proxy:
        condition: service_healthy
      loki:
        condition: service_healthy
    ports:
      - "${PROMTAIL_PORT:-9080}:9080"
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./configs/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    networks:
      - gs-ai-network
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 9080 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "15m"
        max-file: "3"

  uptime-kuma:
    image: louislam/uptime-kuma:1.23.11
    container_name: gs-ai-uptime-kuma
    restart: unless-stopped
    ports:
      - "${UPTIME_KUMA_PORT:-3005}:3001"
    volumes:
      - uptime_kuma_data:/app/data
    networks:
      - gs-ai-network
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 3001 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
