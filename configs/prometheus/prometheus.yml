global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'gs-ai-cloud-monitor'

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'traefik'
    static_configs:
      - targets: ['traefik:8080']

  - job_name: 'qdrant'
    static_configs:
      - targets: ['qdrant:6333']

  - job_name: 'litellm'
    static_configs:
      - targets: ['litellm:4000']
