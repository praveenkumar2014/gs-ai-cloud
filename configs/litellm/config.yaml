model_list:
  - model_name: llama3
    litellm_params:
      model: ollama/llama3
      api_base: http://ollama:11434

  - model_name: mistral
    litellm_params:
      model: ollama/mistral
      api_base: http://ollama:11434

router_settings:
  routing_strategy: usage-based-routing
  redis_host: redis
  redis_port: 6379
  redis_password: "${REDIS_PASSWORD:-redis_secure_password_change_me}"

general_settings:
  master_key: "${LITELLM_MASTER_KEY:-sk-gs-ai-cloud-master-key-change-me}"
  database_url: "postgresql://${POSTGRES_USER:-gscloud}:${POSTGRES_PASSWORD:-postgres_secure_password_change_me}@postgres:5432/${POSTGRES_DB:-gscloud}"
