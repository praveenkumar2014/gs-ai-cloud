model_list:
  - model_name: ollama-chat
    litellm_params:
      model: ollama/llama3.1:8b
      api_base: http://ollama:11434
  - model_name: vllm
    litellm_params:
      model: openai/Qwen/Qwen2.5-7B-Instruct
      api_base: http://vllm:8000/v1
      api_key: none
litellm_settings:
  drop_params: true
  request_timeout: 600
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
